name: lftp deploy
description: Mirror a build artifact to a remote path via lftp.
inputs:
  lftp-site:
    description: "Hostname (protocol depends on the site value, e.g. ftp://..., ftps://...)."
    required: true
  lftp-user:
    description: "Username."
    required: true
  lftp-password:
    description: "Password."
    required: true
  mirror-exclude-rx-from:
    description: "Path to the regex exclude list inside the artifact (one pattern per line)."
    required: false
    default: ".bsaweb/ci-cd/lftp-exclude-regex.txt"
  mirror-exclude:
    description: "Glob/path passed to lftp mirror --exclude (protects remote paths from sync/delete)."
    required: false
    default: "web/app/uploads"
  mirror-remote-path:
    description: "Remote path on the server (e.g. /httpdocs)."
    required: true
  artifact-name:
    description: "Artifact to download; must match wordpress-bedrock-build."
    required: false
    default: "bedrock-build"
  mirror-parallel:
    description: "Number of parallel transfers (lftp mirror --parallel)."
    required: false
    default: "10"
  mirror-dry-run:
    description: "Pass --dry-run to lftp mirror (simulate without transferring files)."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: _deploy

    - name: Install lftp
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Mirror via lftp
      shell: bash
      working-directory: _deploy
      env:
        MIRROR_EXCLUDE_RX_FROM: ${{ inputs.mirror-exclude-rx-from }}
        MIRROR_EXCLUDE: ${{ inputs.mirror-exclude }}
        MIRROR_REMOTE_PATH: ${{ inputs.mirror-remote-path }}
        MIRROR_PARALLEL: ${{ inputs.mirror-parallel }}
        MIRROR_DRY_RUN: ${{ inputs.mirror-dry-run }}
        LFTP_SITE: ${{ inputs.lftp-site }}
        LFTP_USER: ${{ inputs.lftp-user }}
        LFTP_PASSWORD: ${{ inputs.lftp-password }}
      run: |
        set -euo pipefail
        if [ -z "$MIRROR_REMOTE_PATH" ]; then
          echo "ERROR: mirror-remote-path is empty — aborting to avoid deploying to the server root." >&2
          exit 1
        fi
        REMOTE_PATH="$MIRROR_REMOTE_PATH"
        REMOTE_PATH_NORMALIZED="${REMOTE_PATH%/}"
        if [ "$REMOTE_PATH_NORMALIZED" = "/" ] || [ "$REMOTE_PATH_NORMALIZED" = "." ] || [ "$REMOTE_PATH_NORMALIZED" = "./" ] || [ -z "$REMOTE_PATH_NORMALIZED" ]; then
          echo "ERROR: mirror-remote-path is a dangerous path: '$REMOTE_PATH' — aborting." >&2
          echo "ERROR: With --delete enabled, lftp removes remote files not present locally." >&2
          echo "ERROR: --exclude-rx-from does not protect against deletion when mirroring to the server root." >&2
          echo "ERROR: Set mirror-remote-path to a specific subdirectory (e.g. /httpdocs)." >&2
          exit 1
        fi
        if echo "$REMOTE_PATH" | grep -qE '\.\.|^\.\./|/\.\.'; then
          echo "ERROR: mirror-remote-path contains '..' which is dangerous: '$REMOTE_PATH' — aborting." >&2
          exit 1
        fi
        if [ -n "$MIRROR_EXCLUDE_RX_FROM" ] && [ ! -f "$MIRROR_EXCLUDE_RX_FROM" ]; then
          echo "ERROR: exclude file '$MIRROR_EXCLUDE_RX_FROM' not found in artifact — aborting to avoid unprotected --delete." >&2
          exit 1
        fi
        EXCLUDE_FILE=""
        if [ -n "$MIRROR_EXCLUDE_RX_FROM" ] && [ -f "$MIRROR_EXCLUDE_RX_FROM" ]; then
          EXCLUDE_FILE="$(realpath "$MIRROR_EXCLUDE_RX_FROM")"
        fi
        {
          echo "set net:reconnect-interval-base 5"
          echo "set net:max-retries 2"
          echo "set net:socket-buffer 33554432"
          echo "set ftps:initial-prot ''"
          echo "set ftp:ssl-force true"
          echo "set ftp:ssl-protect-data true"
          echo "set ssl:verify-certificate no"
          echo "set sftp:auto-confirm yes"
          printf 'open -u %s,%s %s\n' "$LFTP_USER" "$LFTP_PASSWORD" "$LFTP_SITE"
          echo -n "mirror"
          if [ "$MIRROR_DRY_RUN" = "true" ]; then
            echo -n " --dry-run"
          fi
          if [ -n "$EXCLUDE_FILE" ]; then
            printf ' --exclude-rx-from="%s"' "$EXCLUDE_FILE"
          fi
          if [ -n "$MIRROR_EXCLUDE" ]; then
            printf ' --exclude=%s' "$MIRROR_EXCLUDE"
          fi
          echo " --no-empty-dirs --delete --verbose --parallel=$MIRROR_PARALLEL -R . $MIRROR_REMOTE_PATH"
          echo "quit"
        } > /tmp/lftp.script
        lftp -f /tmp/lftp.script
